[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "romganizer"
version = "1.0.0"
description = "Sort a messy ROM collection into roms/{system}/ and bios/{system}/ by header bytes, extension, path hints and contents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Clark Hackworth" }]
keywords = ["rom", "emulation", "dat", "no-intro", "redump", "library"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]

[project.scripts]
romganizer = "romganizer:main"
find-dups = "find_dups:main"
plan-dedup = "plan_dedup:main"

[tool.setuptools]
# Flat stdlib-only modules at the repo root -- no package directories.
py-modules = ["romganizer", "find_dups", "plan_dedup"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["F", "E9"]